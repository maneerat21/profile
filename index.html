<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แนะนำตัว - มณีรัตน์ ศิริกุล</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Sarabun', Tahoma, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      text-align: center;
    }

    .avatar {
      background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
      padding: 50px 20px 70px;
      color: #fff;
      position: relative;
    }

    .avatar-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ffffff;
      color: #2575fc;
      font-size: 42px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      border: 4px solid rgba(255, 255, 255, 0.6);
    }

    .avatar h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .avatar p.role {
      font-size: 14px;
      opacity: 0.85;
    }

    .info {
      padding: 30px 25px;
      margin-top: -35px;
    }

    .info-item {
      background: #f7f8fc;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 14px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .info-item .icon {
      font-size: 22px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef1fd;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .info-item .label {
      font-size: 12px;
      color: #888;
      margin-bottom: 2px;
    }

    .info-item .value {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    footer {
      padding: 20px;
      font-size: 13px;
      color: #aaa;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <div class="avatar-circle">มร</div>
      <h1>น.ส. มณีรัตน์ ศิริกุล</h1>
      <p class="role">นักศึกษาสาขาวิศวกรรมคอมพิวเตอร์</p>
    </div>

    <div class="info">
      <div class="info-item">
        <div class="icon">👤</div>
        <div>
          <div class="label">ชื่อ-นามสกุล</div>
          <div class="value">น.ส. มณีรัตน์ ศิริกุล</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">🎓</div>
        <div>
          <div class="label">สาขาวิชา</div>
          <div class="value">วิศวกรรมคอมพิวเตอร์</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">🆔</div>
        <div>
          <div class="label">รหัสนักศึกษา</div>
          <div class="value">671540005026-3</div>
        </div>
      </div>
    </div>

          <div class="info-item">
        <div class="icon">📅</div>
        <div>
          <div class="label">ปีการศึกษา</div>
          <div class="value">ปีการศึกษา 2569 (ชั้นปีที่ 3)</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">✉️</div>
        <div>
          <div class="label">ช่องทางติดต่อ</div>
          <div class="value">maneerat.si@ksu.ac.th</div>
        </div>
      </div>

    <footer>
      &copy; 2026 สร้างและเผยแพร่ผ่าน GitHub Pages
    </footer>
  </div>
</body>
</html>
